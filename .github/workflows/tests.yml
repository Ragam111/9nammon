name: tests

# รัน unittest ทั้งชุดอัตโนมัติทุก push เข้า main และทุก pull request
# เป็น safety net ให้ PR (เช่น Phase 2+) รู้ทันทีว่าเทสต์แดงก่อน merge
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
