<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Code Assistant</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="page-chat">

<div id="sidebar">
  <h2>โมเดล</h2>
  <select id="model-select" aria-label="โมเดล">
    <option value="qwen2.5-coder:0.5b">qwen2.5-coder:0.5b</option>
    <option value="qwen2.5-coder:1.5b">qwen2.5-coder:1.5b</option>
    <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
    <option value="qwen2.5-coder:14b">qwen2.5-coder:14b</option>
  </select>

  <h2>ภาษา</h2>
  <select id="lang-select" aria-label="ภาษา">
    <option value="th">ไทย</option>
    <option value="en">English</option>
  </select>

  <h2>Todo</h2>
  <input id="todo-input" placeholder="เพิ่ม todo แล้วกด Enter" aria-label="เพิ่ม todo">
  <p id="todo-msg"></p>
  <ul id="todo-list"></ul>
</div>

<div id="main">
  <div id="main-head">
    <button id="sidebar-toggle" aria-label="สลับเมนู">☰ เมนู</button>
    <span class="main-title">Local Code Assistant</span>
    <a href="/chat" style="margin-left:auto;color:inherit">Chat Hub</a>
    <a href="/login" style="color:inherit">เข้าสู่ระบบ</a>
  </div>
  <div id="chat" role="log" aria-live="polite" aria-label="บทสนทนา"></div>
  <div id="status-bar">โมเดลไม่ได้ต่อเน็ตเอง — ระบบรันผ่าน Ollama ในเครื่องเท่านั้น</div>
  <div id="input-bar">
    <textarea id="user-input" rows="2" placeholder="พิมพ์ข้อความ... (Shift+Enter ขึ้นบรรทัดใหม่)"></textarea>
    <button id="send-btn">ส่ง</button>
  </div>
</div>

<script src="/app.js"></script>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const langSelect = document.getElementById('lang-select');
const todoInput = document.getElementById('todo-input');
const todoList = document.getElementById('todo-list');
const todoMsg = document.getElementById('todo-msg');
const sidebarToggle = document.getElementById('sidebar-toggle');

let history = [];
let busy = false; // true while a reply streams — blocks a second send from Enter or the button

// จอเล็ก: เริ่มด้วยเมนูพับไว้ ให้เห็นแชทเต็มจอก่อน
if (window.matchMedia && window.matchMedia('(max-width: 720px)').matches) {
  document.body.classList.add('nav-collapsed');
}
sidebarToggle.addEventListener('click', () => document.body.classList.toggle('nav-collapsed'));

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// ลิงก์ไปหน้าเข้าสู่ระบบ (หลังล็อกอินจะกลับมาหน้าแชทเดิม)
function addLoginLink(parent) {
  const a = document.createElement('a');
  a.href = '/login?next=/';
  a.textContent = 'เข้าสู่ระบบ';
  a.style.color = 'inherit';
  a.style.textDecoration = 'underline';
  parent.append(' ', a);
}

async function sendMessage() {
  if (busy) return; // กำลังสตรีมคำตอบอยู่ — ไม่ส่งซ้อน (ข้อความในช่องพิมพ์ยังอยู่)
  const text = inputEl.value.trim();
  if (!text) return;
  busy = true;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  const thinking = addMessage('system-note', '(กำลังคิด...)');
  thinking.classList.add('thinking');
  // กำลังสตรีม: ให้โปรแกรมอ่านจอรอจนจบ แล้วประกาศคำตอบครั้งเดียว (ไม่อ่านทุก token)
  chatEl.setAttribute('aria-busy', 'true');

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: window.lca.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        model: modelSelect.value,
        messages: history,
        lang: langSelect.value,
        num_ctx: 8192,
      }),
    });
    if (!res.ok || !res.body) {
      // สตรีมเปิดไม่ได้ (เช่น 401/429/502) — body เป็น JSON error ก้อนเดียว
      const data = await res.json().catch(() => ({ error: 'HTTP ' + res.status }));
      thinking.remove();
      const note = addMessage('system-note', '[error] ' + (data.error || res.status));
      if (res.status === 401) addLoginLink(note); // session หมดอายุ/ยังไม่ล็อกอิน — มีทางไปเข้าสู่ระบบ
      return;
    }
    // อ่านสตรีม SSE: แต่ละ event ขึ้นต้น "data: " ตามด้วย JSON, คั่น event ด้วย \n\n
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let bubble = null, full = '', buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf('\n\n')) !== -1) {
        const line = buf.slice(0, sep).trim();
        buf = buf.slice(sep + 2);
        if (!line.startsWith('data:')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (evt.error) {
          thinking.remove();
          addMessage('system-note', '[error] ' + evt.error);
          return;
        }
        if (evt.delta) {
          if (!bubble) { thinking.remove(); bubble = addMessage('assistant', ''); }
          full += evt.delta;
          bubble.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
        // evt.done = จบสตรีม ไม่ต้องทำอะไรเพิ่ม
      }
    }
    thinking.remove();
    if (full) history.push({ role: 'assistant', content: full });
    else addMessage('system-note', '[error] ไม่ได้รับคำตอบจากโมเดล');
  } catch (err) {
    thinking.remove();
    addMessage('system-note', '[error] ต่อ server ไม่ได้: ' + err.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    chatEl.removeAttribute('aria-busy');
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ---------- Todo ----------
function setTodoMsg(text, isErr) {
  todoMsg.textContent = text || '';
  todoMsg.className = isErr ? 'err' : '';
}

async function loadTodos() {
  try {
    const res = await fetch('/api/todos', { headers: window.lca.authHeaders() });
    if (res.status === 401) {
      todoList.innerHTML = '';
      setTodoMsg('ต้องล็อกอิน/ตั้ง token เพื่อดู todo', true);
      return;
    }
    if (!res.ok) {
      setTodoMsg('โหลด todo ไม่ได้ (error ' + res.status + ')', true);
      return;
    }
    const todos = await res.json();
    const focus = todoFocusState();
    setTodoMsg('');
    todoList.innerHTML = '';
    todos.forEach((t) => todoList.appendChild(renderTodo(t)));
    restoreTodoFocus(focus);
  } catch (err) {
    setTodoMsg('ต่อ server ไม่ได้', true);
    console.error('โหลด todo ไม่สำเร็จ:', err);
  }
}

// One todo row: a real checkbox (keyboard + screen reader) and a named delete button
function renderTodo(t) {
  const li = document.createElement('li');
  li.className = t.done ? 'done' : '';
  const label = document.createElement('label');
  label.className = 'todo-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !!t.done;
  cb.dataset.focusKey = 'cb-' + t.id;
  cb.addEventListener('change', async () => {
    if (!(await toggleTodo(t.id))) cb.checked = !cb.checked; // ไม่สำเร็จ — คืนสถานะเดิม
  });
  const text = document.createElement('span');
  text.textContent = '#' + t.id + ' ' + t.text;
  label.append(cb, text);
  const del = document.createElement('button');
  del.type = 'button';
  del.textContent = '🗑';
  del.className = 'todo-del';
  del.title = 'ลบ todo #' + t.id;
  del.setAttribute('aria-label', 'ลบ todo #' + t.id);
  del.dataset.focusKey = 'del-' + t.id;
  del.addEventListener('click', () => deleteTodo(t.id));
  li.append(label, del);
  return li;
}

// Keep keyboard focus across a list re-render (the old nodes are replaced)
function todoFocusState() {
  const el = document.activeElement;
  if (!el || !todoList.contains(el)) return null;
  return { key: el.dataset.focusKey, index: [...todoList.children].indexOf(el.closest('li')) };
}

function restoreTodoFocus(state) {
  if (!state) return;
  const same = state.key && todoList.querySelector('[data-focus-key="' + CSS.escape(state.key) + '"]');
  const near = todoList.children[Math.min(state.index, todoList.children.length - 1)];
  (same || (near && near.querySelector('input')) || todoInput).focus();
}

// POST a todo action. Returns true on success; otherwise shows the error in #todo-msg.
async function todoPost(url, body, failText) {
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: window.lca.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    if (res.ok) return true;
    if (res.status === 401) setTodoMsg(failText + ' — ต้องล็อกอิน/ตั้ง token ก่อน', true);
    else setTodoMsg(failText + ' (error ' + res.status + ')', true);
  } catch (err) {
    setTodoMsg(failText + ' — ต่อ server ไม่ได้', true);
    console.error(failText + ':', err);
  }
  return false;
}

async function toggleTodo(id) {
  const ok = await todoPost('/api/todos/toggle', { id }, 'อัปเดต todo ไม่สำเร็จ');
  if (ok) loadTodos();
  return ok;
}

async function deleteTodo(id) {
  const ok = await todoPost('/api/todos/delete', { id }, 'ลบ todo ไม่สำเร็จ');
  if (ok) loadTodos();
  return ok;
}

todoInput.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter' || todoInput.readOnly) return; // readOnly = กำลังส่งอยู่ กัน Enter ซ้ำ
  const text = todoInput.value.trim();
  if (!text) return;
  todoInput.readOnly = true;
  const ok = await todoPost('/api/todos', { text }, 'เพิ่ม todo ไม่สำเร็จ');
  todoInput.readOnly = false;
  if (!ok) return; // เก็บข้อความไว้ให้ลองใหม่ได้
  todoInput.value = '';
  loadTodos();
});

loadTodos();
</script>

</body>
</html>
