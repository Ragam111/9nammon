<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Code Assistant</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", sans-serif;
    background: #101014; color: #e8e8ec; display: flex; height: 100vh;
  }
  #sidebar {
    width: 260px; background: #16161c; border-right: 1px solid #26262e;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  #sidebar h2 { font-size: 14px; color: #8b8b96; margin: 0 0 4px; }
  #model-select, #lang-select {
    width: 100%; padding: 8px; background: #1e1e26; color: #e8e8ec;
    border: 1px solid #2e2e38; border-radius: 6px;
  }
  #todo-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
  #todo-list li {
    padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
    display: flex; gap: 6px; align-items: flex-start;
  }
  #todo-list li:hover { background: #1e1e26; }
  #todo-list li.done { opacity: 0.5; text-decoration: line-through; }
  #todo-input {
    width: 100%; padding: 8px; background: #1e1e26; color: #e8e8ec;
    border: 1px solid #2e2e38; border-radius: 6px;
  }
  #main { flex: 1; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 720px; margin: 0 auto 16px; padding: 12px 16px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { background: #22314a; margin-left: auto; margin-right: 0; }
  .msg.assistant { background: #1e1e26; }
  .msg.system-note { background: transparent; color: #8b8b96; font-size: 12px; text-align: center; max-width: none; }
  #input-bar { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid #26262e; }
  #user-input {
    flex: 1; padding: 12px; background: #1e1e26; color: #e8e8ec;
    border: 1px solid #2e2e38; border-radius: 8px; resize: none; font-family: inherit; font-size: 14px;
  }
  #send-btn {
    padding: 0 20px; background: #4f7cff; color: white; border: none;
    border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #status-bar { padding: 4px 24px; font-size: 12px; color: #8b8b96; }
  .todo-del { margin-left: auto; background: transparent; border: none; cursor: pointer; font-size: 13px; }
  #todo-msg { font-size: 12px; margin: 0; min-height: 16px; }
  #todo-msg.err { color: #ff6b6b; }
  /* แถบหัวของ main — มีปุ่มสลับเมนูสำหรับจอเล็ก (ซ่อนบน desktop) */
  #main-head { display: none; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #26262e; }
  #main-head .main-title { font-size: 14px; color: #c8c8d0; }
  #sidebar-toggle {
    background: #1e1e26; color: #e8e8ec; border: 1px solid #2e2e38;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  /* สถานะกำลังคิด: จุดกระพริบเบา ๆ ให้รู้ว่าระบบทำงานอยู่ */
  .msg.system-note.thinking { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  /* ----- responsive: จอเล็ก/มือถือ ----- */
  @media (max-width: 720px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    #main-head { display: flex; }
    #sidebar {
      width: 100%; border-right: none; border-bottom: 1px solid #26262e;
      max-height: 45vh; order: 2;
    }
    #main { order: 1; min-height: 55vh; }
    body.nav-collapsed #sidebar { display: none; }
    .msg { max-width: 100%; }
    #chat { padding: 16px; }
    #input-bar, #status-bar { padding-left: 16px; padding-right: 16px; }
    #user-input { font-size: 16px; } /* กัน iOS zoom ตอนโฟกัส */
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>โมเดล</h2>
  <select id="model-select">
    <option value="qwen2.5-coder:0.5b">qwen2.5-coder:0.5b</option>
    <option value="qwen2.5-coder:1.5b">qwen2.5-coder:1.5b</option>
    <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
    <option value="qwen2.5-coder:14b">qwen2.5-coder:14b</option>
  </select>

  <h2>ภาษา</h2>
  <select id="lang-select">
    <option value="th">ไทย</option>
    <option value="en">English</option>
  </select>

  <h2>Todo</h2>
  <input id="todo-input" placeholder="เพิ่ม todo แล้วกด Enter">
  <p id="todo-msg"></p>
  <ul id="todo-list"></ul>
</div>

<div id="main">
  <div id="main-head">
    <button id="sidebar-toggle" aria-label="สลับเมนู">☰ เมนู</button>
    <span class="main-title">Local Code Assistant</span>
  </div>
  <div id="chat"></div>
  <div id="status-bar">โมเดลไม่ได้ต่อเน็ตเอง — ระบบรันผ่าน Ollama ในเครื่องเท่านั้น</div>
  <div id="input-bar">
    <textarea id="user-input" rows="2" placeholder="พิมพ์ข้อความ... (Shift+Enter ขึ้นบรรทัดใหม่)"></textarea>
    <button id="send-btn">ส่ง</button>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const langSelect = document.getElementById('lang-select');
const todoInput = document.getElementById('todo-input');
const todoList = document.getElementById('todo-list');
const todoMsg = document.getElementById('todo-msg');
const sidebarToggle = document.getElementById('sidebar-toggle');

let history = [];

// จอเล็ก: เริ่มด้วยเมนูพับไว้ ให้เห็นแชทเต็มจอก่อน
if (window.matchMedia && window.matchMedia('(max-width: 720px)').matches) {
  document.body.classList.add('nav-collapsed');
}
sidebarToggle.addEventListener('click', () => document.body.classList.toggle('nav-collapsed'));

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  const thinking = addMessage('system-note', '(กำลังคิด...)');
  thinking.classList.add('thinking');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelSelect.value,
        messages: history,
        lang: langSelect.value,
        num_ctx: 8192,
      }),
    });
    const data = await res.json();
    thinking.remove();
    if (data.error) {
      addMessage('system-note', '[error] ' + data.error);
    } else {
      addMessage('assistant', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    }
  } catch (err) {
    thinking.remove();
    addMessage('system-note', '[error] ต่อ server ไม่ได้: ' + err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ---------- Todo ----------
function setTodoMsg(text, isErr) {
  todoMsg.textContent = text || '';
  todoMsg.className = isErr ? 'err' : '';
}

async function loadTodos() {
  try {
    const res = await fetch('/api/todos');
    if (res.status === 401) {
      todoList.innerHTML = '';
      setTodoMsg('ต้องล็อกอิน/ตั้ง token เพื่อดู todo', true);
      return;
    }
    if (!res.ok) {
      setTodoMsg('โหลด todo ไม่ได้ (error ' + res.status + ')', true);
      return;
    }
    const todos = await res.json();
    setTodoMsg('');
    todoList.innerHTML = '';
    todos.forEach((t) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const label = document.createElement('span');
      label.textContent = '#' + t.id + ' ' + t.text;
      label.style.cursor = 'pointer';
      label.addEventListener('click', () => toggleTodo(t.id));
      const del = document.createElement('button');
      del.textContent = '🗑';
      del.title = 'ลบ';
      del.className = 'todo-del';
      del.addEventListener('click', (e) => { e.stopPropagation(); deleteTodo(t.id); });
      li.appendChild(label);
      li.appendChild(del);
      todoList.appendChild(li);
    });
  } catch (err) {
    setTodoMsg('ต่อ server ไม่ได้', true);
    console.error('โหลด todo ไม่สำเร็จ:', err);
  }
}

async function toggleTodo(id) {
  try {
    await fetch('/api/todos/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    loadTodos();
  } catch (err) {
    console.error('toggle todo ไม่สำเร็จ:', err);
  }
}

async function deleteTodo(id) {
  try {
    await fetch('/api/todos/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    loadTodos();
  } catch (err) {
    console.error('ลบ todo ไม่สำเร็จ:', err);
  }
}

todoInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const text = todoInput.value.trim();
    if (!text) return;
    todoInput.value = '';
    try {
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      loadTodos();
    } catch (err) {
      console.error('เพิ่ม todo ไม่สำเร็จ:', err);
    }
  }
});

loadTodos();
</script>

</body>
</html>
