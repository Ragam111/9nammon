<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA — ผู้ช่วยเขียนโค้ดในเครื่อง</title>
<link rel="preload" href="/fonts/IBMPlexSansThai-Regular.sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body class="page-home">
<header class="home-bar">
  <strong class="home-brand">LCA</strong>
  <span id="lca-status" class="chip" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span id="lca-status-text">…</span>
  </span>
  <label class="home-lang">
    <span data-i18n="lang">ภาษา</span>
    <select id="ui-lang">
      <option value="th">ไทย</option>
      <option value="en">English</option>
    </select>
  </label>
</header>
<main class="home-main">
  <p class="home-kicker" data-i18n="kicker">ทำงานในเครื่อง · ไม่ต้องพึ่งเน็ตสำหรับงานหลัก</p>
  <h1 data-i18n="title">ผู้ช่วยเขียนโค้ดในเครื่องคุณ</h1>
  <p data-i18n="lead">Chat Hub คือที่คุยกับโมเดล เก็บโปรเจกต์ และเทียบคำตอบได้ในหน้าเดียว</p>
  <p><a class="lca-btn primary" href="/chat" data-i18n="cta">เข้า Chat Hub</a></p>
  <p class="meta"><a href="/classic" data-i18n="classic">เครื่องมือเดิม — แชทสั้น เลือกโมเดล และรายการ todo</a></p>
  <p class="meta"><a href="/console" data-i18n="keys">ตั้งค่าคีย์ API</a></p>
</main>
<script src="/app.js"></script>
<script>
(function () {
  var COPY = {
    th: {
      docTitle: "LCA — ผู้ช่วยเขียนโค้ดในเครื่อง",
      lang: "ภาษา",
      kicker: "ทำงานในเครื่อง · ไม่ต้องพึ่งเน็ตสำหรับงานหลัก",
      title: "ผู้ช่วยเขียนโค้ดในเครื่องคุณ",
      lead: "Chat Hub คือที่คุยกับโมเดล เก็บโปรเจกต์ และเทียบคำตอบได้ในหน้าเดียว",
      cta: "เข้า Chat Hub",
      classic: "เครื่องมือเดิม — แชทสั้น เลือกโมเดล และรายการ todo",
      keys: "ตั้งค่าคีย์ API"
    },
    en: {
      docTitle: "LCA — Local Code Assistant",
      lang: "Language",
      kicker: "On this machine · core work stays offline",
      title: "A code assistant on your computer",
      lead: "Chat Hub is where you talk to a model, keep projects, and compare answers.",
      cta: "Open Chat Hub",
      classic: "Older tools — short chat, model picker, and a todo list",
      keys: "API key settings"
    }
  };
  function apply() {
    var lang = window.lca && window.lca.uiLang ? window.lca.uiLang() : "th";
    var pack = COPY[lang] || COPY.th;
    if (window.lca && window.lca.applyI18n) window.lca.applyI18n(COPY);
    document.title = pack.docTitle;
  }
  apply();
  document.addEventListener("lca-lang", apply);
})();
</script>
</body>
</html>
