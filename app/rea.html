<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REA Analysis Report</title>
<style>
:root {
  --lca-bg: #f5f6f4;
  --lca-surface: #ffffff;
  --lca-surface-2: #eceee9;
  --lca-line: #d9ddd4;
  --lca-fg: #1b201a;
  --lca-muted: #5e665b;
  --lca-accent: #1f8a4c;
  --lca-accent-weak: #e3f0e7;
  --lca-ok: #1f8a4c;
  --lca-warn: #b7791f;
  --lca-bad: #c23b34;
  --lca-sans: "LCA Sans", "Leelawadee UI", "Segoe UI", "Noto Sans Thai", Tahoma, system-ui, sans-serif;
  --lca-mono: "LCA Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --lca-r: 10px;
  --lca-r-lg: 14px;
  --lca-gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --lca-bg: #0e120f;
    --lca-surface: #161b16;
    --lca-surface-2: #1d241d;
    --lca-line: #2a332a;
    --lca-fg: #e7ece4;
    --lca-muted: #94a08e;
    --lca-accent: #4cc27a;
    --lca-accent-weak: #1c3325;
    --lca-ok: #4cc27a;
    --lca-warn: #e0a64a;
    --lca-bad: #ef6f67;
  }
}
:root[data-theme="dark"] {
  --lca-bg: #0e120f;
  --lca-surface: #161b16;
  --lca-surface-2: #1d241d;
  --lca-line: #2a332a;
  --lca-fg: #e7ece4;
  --lca-muted: #94a08e;
  --lca-accent: #4cc27a;
  --lca-accent-weak: #1c3325;
  --lca-ok: #4cc27a;
  --lca-warn: #e0a64a;
  --lca-bad: #ef6f67;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 15px/1.6 var(--lca-sans);
  background: var(--lca-bg);
  color: var(--lca-fg);
}
header.top {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
  padding: 18px var(--lca-gutter);
  border-bottom: 1px solid var(--lca-line);
  background: var(--lca-surface);
}
header.top h1 { margin: 0; font-size: 20px; }
.tag {
  font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--lca-accent-weak); color: var(--lca-accent);
}
.muted { color: var(--lca-muted); font-size: 13px; }
main { max-width: 1040px; margin: 0 auto; padding: 20px var(--lca-gutter) 48px; }
section { margin-top: 24px; }
h2 { font-size: 16px; margin: 0 0 10px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card {
  background: var(--lca-surface);
  border: 1px solid var(--lca-line);
  border-radius: var(--lca-r-lg);
  padding: 14px 16px;
}
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .file { font-family: var(--lca-mono); font-size: 12px; color: var(--lca-muted); word-break: break-all; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 13px; }
dt { color: var(--lca-muted); }
dd { margin: 0; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--lca-accent-weak); color: var(--lca-ok); }
.pill.warn { background: #f6ecd8; color: var(--lca-warn); }
.pill.bad { background: #f7e0de; color: var(--lca-bad); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill.warn { background: #3a2f18; }
  :root:not([data-theme="light"]) .pill.bad { background: #3d211f; }
}
:root[data-theme="dark"] .pill.warn { background: #3a2f18; }
:root[data-theme="dark"] .pill.bad { background: #3d211f; }
.table-wrap { overflow-x: auto; background: var(--lca-surface); border: 1px solid var(--lca-line); border-radius: var(--lca-r-lg); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--lca-line); vertical-align: top; }
th { color: var(--lca-muted); font-weight: 600; background: var(--lca-surface-2); }
tr:last-child td { border-bottom: none; }
code { font-family: var(--lca-mono); font-size: 12px; word-break: break-word; }
ul.lim { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--lca-muted); }
.verdict {
  border-left: 4px solid var(--lca-accent);
  background: var(--lca-surface);
  border-radius: var(--lca-r);
  padding: 12px 16px;
}
footer { margin-top: 32px; font-size: 12px; color: var(--lca-muted); }
</style>
</head>
<body>
<header class="top">
  <h1>REA · ผลวิเคราะห์ Claude desktop</h1>
  <span class="tag">รายงานแบบ static</span>
  <span class="muted" id="meta"></span>
</header>

<main>
  <section>
    <h2>สรุปคำตอบ</h2>
    <div class="verdict" id="verdict"></div>
  </section>

  <section>
    <h2>ผลการรันแต่ละรอบ</h2>
    <div class="grid" id="runs"></div>
  </section>

  <section>
    <h2>IPC handler ฝั่ง main process</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Channel</th><th>ไฟล์</th><th>API</th><th>ตรวจ sender</th><th>หมายเหตุ</th></tr></thead>
        <tbody id="handlers"></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<script src="rea-data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.REA_DATA;
  if (!D) { document.getElementById("verdict").textContent = "ไม่พบไฟล์ข้อมูล rea-data.js"; return; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function pill(kind, text) { return el("span", "pill " + kind, text); }

  document.getElementById("meta").textContent = "สร้างเมื่อ " + D.generated + " · " + D.app + " · " + D.rea;
  document.getElementById("verdict").textContent = D.verdict;

  var runsBox = document.getElementById("runs");
  D.runs.forEach(function (r) {
    var card = el("div", "card");
    card.appendChild(el("h3", null, r.label));
    card.appendChild(el("div", "file", r.file));
    var cov = r.coverage.application === "partial" ? pill("warn", "ไม่ครบ") : pill("ok", "ครบ");
    card.appendChild(cov);
    var dl = el("dl");
    [
      ["ไฟล์ที่เลือก", r.sources_selected.length],
      ["parse สำเร็จ", r.parsed_js],
      ["ข้าม (skipped)", r.skipped_js],
      ["parse ล้มเหลว", r.parse_failures],
      ["IPC main handler ที่ REA เห็น", r.ipc_main_handlers],
      ["sender-validation ที่เห็น", r.sender_validation_observations],
      ["unknowns (semantic)", r.unknowns.semantic],
      ["evidence", r.evidence_id]
    ].forEach(function (kv) {
      dl.appendChild(el("dt", null, kv[0]));
      dl.appendChild(el("dd", null, kv[1]));
    });
    card.appendChild(dl);
    if (r.limitations.length) {
      var ul = el("ul", "lim");
      r.limitations.forEach(function (t) { ul.appendChild(el("li", null, t)); });
      card.appendChild(ul);
    }
    runsBox.appendChild(card);
  });

  var tb = document.getElementById("handlers");
  D.handlers.forEach(function (h) {
    var tr = el("tr");
    tr.appendChild(el("td", null, h.channel));
    tr.appendChild(el("td", null, h.file));
    tr.appendChild(el("td", null, h.api));
    var td = el("td");
    td.appendChild(h.check === "ok" ? pill("ok", "ตรวจแล้ว") : pill("warn", "ไม่พบการตรวจ"));
    tr.appendChild(td);
    tr.appendChild(el("td", null, h.note));
    tb.appendChild(tr);
  });

  document.getElementById("foot").textContent =
    "ข้อมูลมาจาก log ของการรัน rea-agents 6.9.0 บนไฟล์ app.asar ที่ติดตั้งในเครื่อง ไม่มีการรันแอปจริง ผลเป็นการวิเคราะห์แบบ static เท่านั้น";
})();
</script>
</body>
</html>
