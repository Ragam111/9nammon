<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f8a4c">
<title>ออฟไลน์ — LCA</title>
<style>
  :root { --bg: #f5f6f4; --fg: #1b201a; --muted: #5e665b; --accent: #1f8a4c; --card: #ffffff; --line: #d9ddd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e120f; --fg: #e6ebe4; --muted: #9aa596; --accent: #3fb26f; --card: #161b16; --line: #2a332a; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Leelawadee UI", "Noto Sans Thai", sans-serif; }
  main { max-width: 480px; margin: 12vh auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; color: var(--accent); }
  p { line-height: 1.6; color: var(--muted); margin: 8px 0; }
  a { display: inline-block; margin-top: 12px; padding: 10px 16px; border-radius: 10px;
    background: var(--accent); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ออฟไลน์อยู่ — ติดต่อเซิร์ฟเวอร์ไม่ได้</h1>
    <p>ตอนนี้เข้าถึงเซิร์ฟเวอร์ LCA หรือ Ollama ไม่ได้ อาจเพราะเครือข่ายหลุด
       หรือยังไม่ได้เปิดโปรแกรม LCA บนเครื่องหลัก</p>
    <p>ตรวจว่าเครื่องที่รัน LCA เปิดอยู่และ Ollama ทำงาน แล้วกดลองใหม่</p>
    <a href="/chat">ลองใหม่</a>
  </div>
</main>
</body>
</html>
