<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการโมเดล · LCA</title>
<link rel="stylesheet" href="/app.css">
<style>
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .ram { margin: 8px 0 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid rgba(127,127,127,.25); vertical-align: top; }
  .fit-fit { color: #1a7f37; } .fit-tight { color: #9a6700; } .fit-no { color: #cf222e; } .fit-unknown { opacity: .7; }
  progress { width: 140px; }
  .msg { min-height: 1.4em; margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>จัดการโมเดลในเครื่อง</h1>
  <p><a href="/chat">กลับไปหน้าแชต</a></p>
  <div class="ram" id="ram">กำลังอ่านข้อมูลเครื่อง…</div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <h2>แนะนำ (ตระกูล qwen)</h2>
  <table>
    <thead><tr><th>โมเดล</th><th>ขนาด</th><th>เหมาะกับเครื่องนี้</th><th>ใช้ทำอะไร</th><th></th></tr></thead>
    <tbody id="catalog"></tbody>
  </table>

  <h2>ติดตั้งใน Ollama แล้ว</h2>
  <ul id="installed"></ul>
</main>
<script src="/app.js"></script>
<script>
(function () {
  const FIT = { fit: "เหมาะ", tight: "ตึง (อาจช้า)", no: "RAM ไม่พอ", unknown: "วัด RAM ไม่ได้" };
  const $ = (id) => document.getElementById(id);
  const headers = () => Object.assign(
    { "Content-Type": "application/json" },
    window.lca && typeof window.lca.headers === "function" ? window.lca.headers() : {});

  function text(el, s) { el.textContent = s; return el; }

  async function load() {
    $("msg").textContent = "";
    let data;
    try {
      const res = await fetch("/api/models/catalog", { headers: headers() });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    } catch (e) {
      $("ram").textContent = "โหลดข้อมูลไม่สำเร็จ: " + e.message;
      return;
    }
    const free = data.ram_free_gb == null ? "ไม่ทราบ" : data.ram_free_gb + " GB";
    const total = data.ram_total_gb == null ? "ไม่ทราบ" : data.ram_total_gb + " GB";
    $("ram").textContent = "RAM ว่าง " + free + " จากทั้งหมด " + total +
      " · Ollama: " + (data.ollama_running ? "ทำงานอยู่" : "ไม่ทำงาน — เปิด Ollama ก่อน");

    const body = $("catalog");
    body.replaceChildren();
    for (const m of data.catalog) {
      const tr = document.createElement("tr");
      tr.appendChild(text(document.createElement("td"), m.name));
      tr.appendChild(text(document.createElement("td"), m.size_gb + " GB"));
      const fit = text(document.createElement("td"), FIT[m.fit] || m.fit);
      fit.className = "fit-" + m.fit;
      tr.appendChild(fit);
      tr.appendChild(text(document.createElement("td"), m.use));
      const act = document.createElement("td");
      if (m.installed) {
        act.textContent = "ติดตั้งแล้ว";
      } else {
        const btn = text(document.createElement("button"), "ติดตั้ง");
        btn.disabled = !data.ollama_running;
        btn.addEventListener("click", () => pull(m.name, btn, act));
        act.appendChild(btn);
      }
      tr.appendChild(act);
      body.appendChild(tr);
    }

    const ul = $("installed");
    ul.replaceChildren();
    if (!data.installed.length) {
      ul.appendChild(text(document.createElement("li"), data.ollama_running ? "ยังไม่มีโมเดล" : "ต่อ Ollama ไม่ได้"));
    }
    for (const m of data.installed) {
      ul.appendChild(text(document.createElement("li"),
        m.name + (m.size_gb != null ? " (" + m.size_gb + " GB)" : "")));
    }
  }

  async function pull(name, btn, cell) {
    btn.disabled = true;
    const bar = document.createElement("progress");
    bar.max = 1; bar.value = 0;
    cell.replaceChildren(bar);
    $("msg").textContent = "กำลังติดตั้ง " + name + "…";
    try {
      const res = await fetch("/api/models/pull", {
        method: "POST", headers: headers(), body: JSON.stringify({ model: name }) });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.error || ("HTTP " + res.status));
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "", last = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (!line) continue;
          last = JSON.parse(line);
          if (last.total && last.completed != null) { bar.max = last.total; bar.value = last.completed; }
          if (last.status === "error") throw new Error(last.error);
        }
      }
      if (!last || last.status !== "done") throw new Error("การติดตั้งหยุดกลางทาง");
      $("msg").textContent = "ติดตั้ง " + name + " เสร็จแล้ว";
    } catch (e) {
      $("msg").textContent = "ติดตั้ง " + name + " ไม่สำเร็จ: " + e.message;
    }
    load();
  }

  load();
})();
</script>
</body>
</html>
