<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LCA — Dev View</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="page-dev">
  <header>
    <h1>LCA — Dev View</h1>
    <span class="muted" id="who">ต้องเป็น ADMIN ขึ้นไป</span>
    <span style="flex:1"></span>
    <input id="token" type="password" placeholder="X-Auth-Token หรือ API key" autocomplete="off" />
    <button id="load">โหลดข้อมูล</button>
  </header>
  <main>
    <p class="muted">หน้าสำหรับนักพัฒนา — spec เครื่อง (<code>/api/sysinfo</code>) + ทรัพยากรสด/คอขวด
      (<code>/api/metrics</code>) ทั้งคู่ gate สิทธิ์ ADMIN</p>
    <div id="error" class="err"></div>
    <section id="metrics-wrap" class="card" style="margin-bottom:12px" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
        <h2 style="margin:0">ทรัพยากรสด</h2>
        <button id="refresh-metrics" type="button">รีเฟรช</button>
      </div>
      <div id="metrics"></div>
    </section>
    <section id="support-wrap" class="card" style="margin-bottom:12px" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
        <h2 style="margin:0">Support tickets</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="support-filter" class="sel" aria-label="กรองสถานะ">
            <option value="">ทุกสถานะ</option>
            <option value="open">open</option>
            <option value="in_progress">in_progress</option>
            <option value="resolved">resolved</option>
            <option value="closed">closed</option>
          </select>
          <button id="refresh-support" type="button">รีเฟรช</button>
        </div>
      </div>
      <div id="support-counts" class="support-tiles"></div>
      <p id="support-err" class="err" style="display:none"></p>
      <div id="support-table"></div>
    </section>
    <div id="content" class="grid"></div>
  </main>

  <style>
    /* select + tile เฉพาะหน้า dev — ใช้ token design system กลาง ไม่แตะ app.css */
    .page-dev .sel { font:inherit; background:var(--lca-surface-2); color:var(--lca-fg); border:1px solid var(--lca-line); border-radius:var(--lca-r); padding:9px 11px; }
    .page-dev .support-tiles { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .page-dev .tile { display:flex; flex-direction:column; gap:2px; min-width:72px; padding:10px 12px; border:1px solid var(--lca-line); border-radius:var(--lca-r); }
    .page-dev .tile .lca-num { font-size:20px; font-weight:600; }
    .page-dev .tile .muted { font-family:var(--lca-mono); font-size:11px; }
  </style>

  <script>
    const $ = (id) => document.getElementById(id);
    // จำ token ไว้ใน sessionStorage (ต่อ tab) เพื่อสะดวก — ไม่เก็บถาวร
    try { $('token').value = sessionStorage.getItem('lca_dev_token') || ''; } catch (e) {}

    function authHeaders() {
      const t = $('token').value.trim();
      // รองรับทั้ง master token และ API key — ส่งทั้งคู่ server จะเลือกเอง
      return t ? { 'X-Auth-Token': t, 'X-API-Key': t } : {};
    }

    function card(title, rowsHtml) {
      return `<div class="card"><h2>${title}</h2>${rowsHtml}</div>`;
    }
    function kv(k, v) { return `<div class="kv"><span class="muted">${k}</span><span>${v ?? '-'}</span></div>`; }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    // ---------- ทรัพยากรสด (/api/metrics) ----------
    function pctClass(p) { p = Number(p) || 0; return p >= 90 ? 'bad' : p >= 70 ? 'warn' : ''; }
    function meterRow(lab, pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      return `<div class="meter"><div class="row"><span class="lab">${esc(lab)}</span>` +
             `<span class="lca-num">${p.toFixed(0)}%</span></div>` +
             `<div class="track"><div class="fill ${pctClass(p)}" style="width:${p}%"></div></div></div>`;
    }
    function renderMetrics(m) {
      const snap = m.snapshot || {}, mem = snap.memory || {}, cpu = snap.cpu || {};
      let rows = meterRow('CPU', cpu.percent) + meterRow('RAM', mem.percent);
      if (mem.swap_total) rows += meterRow('SWAP', mem.swap_percent);
      (snap.disks || []).filter((d) => !d.readonly).slice(0, 2)
        .forEach((d) => { rows += meterRow('DISK ' + d.mountpoint, d.percent); });

      let html = `<div style="display:flex;flex-direction:column;gap:12px">${rows}</div>`;
      html += `<div class="note" style="margin-top:12px">${esc(m.verdict || '')}</div>`;
      if (m.lca && m.lca.note) html += `<div class="note">LCA: ${esc(m.lca.note)}</div>`;
      const alerts = (m.findings || []).filter((f) => f.severity !== 'OK' && f.severity !== 'INFO');
      alerts.forEach((f) => { html += `<div class="kv"><span class="muted">${esc(f.resource)}</span><span>${esc(f.message)}</span></div>`; });
      $('metrics').innerHTML = html;
    }
    async function loadMetrics() {
      try {
        const res = await fetch('/api/metrics', { headers: authHeaders() });
        if (!res.ok) { $('metrics').innerHTML = `<div class="err">โหลด metrics ไม่ได้ (${res.status})</div>`; }
        else { renderMetrics(await res.json()); }
      } catch (err) {
        $('metrics').innerHTML = '<div class="err">ต่อ server ไม่ได้</div>';
      }
      $('metrics-wrap').hidden = false;
    }

    // ---------- Support tickets (/api/admin/support/tickets) ----------
    const SUP_STATUSES = ['open', 'in_progress', 'resolved', 'closed'];
    function supStatusSelect(id, current) {
      const opts = SUP_STATUSES.map((s) =>
        `<option value="${s}"${s === current ? ' selected' : ''}>${s}</option>`).join('');
      return `<select class="sel sup-row-status" data-id="${esc(id)}">${opts}</select>`;
    }
    function renderSupportCounts(counts) {
      counts = counts || {};
      const order = ['total'].concat(SUP_STATUSES);
      $('support-counts').innerHTML = order.map((k) => {
        const n = counts[k] != null ? counts[k] : 0;
        return `<div class="tile"><span class="lca-num">${esc(n)}</span><span class="muted">${k}</span></div>`;
      }).join('');
    }
    function renderSupportRows(tickets) {
      if (!tickets.length) { $('support-table').innerHTML = '<div class="muted">ยังไม่มีเรื่องแจ้ง</div>'; return; }
      let h = '<table><tr><th>#</th><th>ช่อง</th><th>ชนิด</th><th>หัวข้อ</th><th>ผู้แจ้ง</th><th>สถานะ</th><th></th></tr>';
      tickets.forEach((t) => {
        h += `<tr><td>${esc(t.id)}</td><td>${esc(t.channel)}</td><td>${esc(t.kind)}</td>` +
             `<td>${esc(t.subject)}</td><td>${esc(t.reporter || '—')}</td>` +
             `<td>${supStatusSelect(t.id, t.status)}</td>` +
             `<td><button class="sup-save" data-id="${esc(t.id)}" type="button">บันทึก</button></td></tr>`;
      });
      h += '</table>';
      $('support-table').innerHTML = h;
    }
    async function loadSupport() {
      $('support-err').style.display = 'none';
      const status = $('support-filter').value;
      const url = '/api/admin/support/tickets' + (status ? '?status=' + encodeURIComponent(status) : '');
      try {
        const res = await fetch(url, { headers: authHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { $('support-err').textContent = data.error || ('error ' + res.status); $('support-err').style.display = ''; }
        else { renderSupportCounts(data.counts); renderSupportRows(data.tickets || []); }
      } catch (err) {
        $('support-err').textContent = 'ต่อ server ไม่ได้'; $('support-err').style.display = '';
      }
      $('support-wrap').hidden = false;
    }

    function render(info) {
      const c = info.cpu || {};
      const cores = c.physical_cores ? `${c.physical_cores}P / ${c.logical_cores}L` : `${c.logical_cores}L`;
      const freq = c.max_freq_mhz ? ` @ ${c.max_freq_mhz} MHz` : '';
      let html = '';
      html += card('Host', kv('Hostname', esc(info.hostname)) + kv('OS', esc(info.os)) +
        kv('Platform', esc(info.platform)) + kv('Python', esc(info.python)));
      html += card('CPU', kv('Model', esc(c.model)) + kv('Cores', cores + freq) + kv('Arch', esc(c.arch)));
      html += card('Memory', kv('Total RAM', esc((info.memory || {}).total_human)));

      let st = '<table><tr><th>Mount</th><th>Size</th><th>FS</th></tr>';
      (info.storage || []).forEach((s) => {
        st += `<tr><td>${esc(s.mountpoint)}</td><td>${esc(s.total_human)}</td><td>${esc(s.fstype)}</td></tr>`;
      });
      st += '</table>';
      html += card('Storage', st);

      let g = '';
      if ((info.gpus || []).length) {
        info.gpus.forEach((x) => {
          const tag = x.compute_capable
            ? '<span class="tag ok">compute</span>'
            : '<span class="tag bad">integrated</span>';
          g += `<div class="kv"><span>${esc(x.name)}</span>${tag}</div>`;
        });
      } else {
        g = '<div class="muted">ไม่พบ GPU (best-effort)</div>';
      }
      g += `<div class="note">${esc(info.gpu_note || '')}</div>`;
      html += card('GPU', g);

      $('content').innerHTML = html;
    }

    async function load() {
      $('error').textContent = '';
      $('load').disabled = true;
      try { sessionStorage.setItem('lca_dev_token', $('token').value.trim()); } catch (e) {}
      try {
        const res = await fetch('/api/sysinfo', { headers: authHeaders() });
        if (res.status === 401) { $('error').textContent = 'unauthorized — ใส่ token/API key ให้ถูก'; return; }
        if (res.status === 403) { $('error').textContent = 'forbidden — ต้องมีสิทธิ์ ADMIN ขึ้นไป'; return; }
        if (!res.ok) { $('error').textContent = 'error ' + res.status; return; }
        const info = await res.json();
        $('who').textContent = 'เชื่อมต่อแล้ว';
        render(info);
        loadMetrics();   // โหลดทรัพยากรสดต่อเลยหลัง auth ผ่าน
        loadSupport();   // + support dashboard (ใช้ token เดียวกัน, สิทธิ์ ADMIN)
      } catch (err) {
        $('error').textContent = 'ต่อ server ไม่ได้: ' + err.message;
      } finally {
        $('load').disabled = false;
      }
    }

    $('load').addEventListener('click', load);
    $('refresh-metrics').addEventListener('click', loadMetrics);
    $('refresh-support').addEventListener('click', loadSupport);
    $('support-filter').addEventListener('change', loadSupport);
    // บันทึกสถานะ ticket — ใช้ event delegation (ปุ่มถูกสร้างใหม่ทุกครั้งที่ render)
    $('support-table').addEventListener('click', async (e) => {
      const btn = e.target.closest('.sup-save');
      if (!btn) return;
      const id = btn.dataset.id;
      const sel = $('support-table').querySelector('.sup-row-status[data-id="' + id + '"]');
      if (!sel) return;
      btn.disabled = true;
      try {
        const res = await fetch('/api/admin/support/tickets/status', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: JSON.stringify({ id: Number(id), status: sel.value })
        });
        if (!res.ok) { const d = await res.json().catch(() => ({})); alert('บันทึกไม่สำเร็จ: ' + (d.error || res.status)); }
        else { loadSupport(); }
      } catch (err) { alert('ต่อ server ไม่ได้'); }
      finally { btn.disabled = false; }
    });
    $('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
    if ($('token').value) load();
  </script>
</body>
</html>
