<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบ — LCA</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/app.js" defer></script>
</head>
<body class="page-dev">
  <header>
    <h1>LCA · เข้าสู่ระบบ</h1>
    <span class="muted" style="margin-left:auto">Local Code Assistant</span>
  </header>

  <main style="max-width:440px">
    <div class="card">
      <h2>เข้าสู่ระบบ</h2>

      <div id="status" class="note">กำลังตรวจสอบสถานะ…</div>

      <div id="form" style="display:none; margin-top:10px">
        <form id="pw-form" autocomplete="on" style="display:flex; flex-direction:column; gap:8px">
          <input id="username" type="text" autocomplete="username" placeholder="username" />
          <input id="password" type="password" autocomplete="current-password" placeholder="password" />
          <button id="go" type="submit">เข้าสู่ระบบ</button>
        </form>
        <p id="err" class="err" style="display:none; margin-top:8px"></p>

        <details style="margin-top:12px">
          <summary class="muted">หรือวาง API key / token</summary>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px">
            <input id="key" type="password" autocomplete="off" style="flex:1"
                   placeholder="X-API-Key หรือ X-Auth-Token" />
            <button id="go-key" type="button">ใช้ key</button>
          </div>
        </details>
        <p class="note">
          เปิดบนเครื่องนี้โดยไม่ได้ตั้ง token: หน้าเว็บได้รับ session token ของการเปิดครั้งนี้เอง
          — <a href="/">ไปหน้าแชต</a> ได้เลย. ถ้าเปิดออกนอกเครื่อง ให้ล็อกอินด้วยบัญชี หรือวาง token / API key
        </p>
      </div>

      <div id="signed" style="display:none; margin-top:10px">
        <div class="kv"><span>ผู้ใช้</span><span id="who-name">—</span></div>
        <div class="kv"><span>สิทธิ์</span><span id="who-role">—</span></div>
        <div class="kv"><span>ระดับ</span><span id="who-tier">—</span></div>
        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap">
          <button id="to-chat">ไปหน้าแชต</button>
          <button id="to-dev" style="display:none; background:var(--lca-surface-2); color:var(--lca-fg); border-color:var(--lca-line)">หน้า dev</button>
          <button id="logout" style="background:var(--lca-surface-2); color:var(--lca-bad); border-color:var(--lca-line)">ออกจากระบบ</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function qs(id) { return document.getElementById(id); }
    function nextTarget() {
      var p = new URLSearchParams(location.search).get("next");
      // รับเฉพาะ path ภายใน (ขึ้นต้น "/" ตัวเดียว) กัน open-redirect
      return (p && /^\/[^/]/.test(p)) ? p : "/";
    }
    function showErr(msg) { qs("err").textContent = msg; qs("err").style.display = ""; }

    function showForm(msg) {
      qs("status").textContent = msg || "ล็อกอินด้วยบัญชี หรือวาง key";
      qs("form").style.display = "";
      qs("signed").style.display = "none";
    }
    function showSigned(me) {
      qs("status").textContent = "เข้าสู่ระบบแล้ว";
      qs("who-name").textContent = me.username || "—";
      qs("who-role").textContent = me.role || "—";
      qs("who-tier").textContent = me.tier || "—";
      // ปุ่ม dev โชว์เฉพาะ ADMIN/CEO — USER ไม่เห็น (server ก็บล็อก /dev อีกชั้น)
      qs("to-dev").style.display = (me.role === "ADMIN" || me.role === "CEO") ? "" : "none";
      qs("form").style.display = "none";
      qs("signed").style.display = "";
    }

    async function refresh() {
      var me = await window.lca.whoami();
      if (me) showSigned(me); else showForm();
    }

    async function doPasswordLogin(ev) {
      if (ev) ev.preventDefault();
      qs("err").style.display = "none";
      var u = qs("username").value.trim(), p = qs("password").value;
      if (!u || !p) { showErr("กรุณากรอก username และ password"); return; }
      qs("go").disabled = true;
      var me = await window.lca.login(u, p);
      qs("go").disabled = false;
      if (me) { location.href = nextTarget(); }
      else { qs("password").value = ""; showErr(window.lca.lastError || "เข้าสู่ระบบไม่สำเร็จ"); }
    }

    async function doKeyLogin() {
      var v = qs("key").value.trim();
      qs("err").style.display = "none";
      if (!v) { showErr("กรุณาวาง key ก่อน"); return; }
      qs("go-key").disabled = true;
      window.lca.setKey(v);
      var me = await window.lca.whoami();
      qs("go-key").disabled = false;
      if (me) { location.href = nextTarget(); }
      else { window.lca.clearKey(); showErr("key ไม่ถูกต้องหรือหมดอายุ — ลองใหม่"); }
    }

    window.addEventListener("DOMContentLoaded", function () {
      qs("pw-form").addEventListener("submit", doPasswordLogin);
      qs("go-key").addEventListener("click", doKeyLogin);
      qs("key").addEventListener("keydown", function (e) { if (e.key === "Enter") doKeyLogin(); });
      qs("to-chat").addEventListener("click", function () { location.href = "/"; });
      qs("to-dev").addEventListener("click", function () { location.href = "/dev"; });
      qs("logout").addEventListener("click", async function () { await window.lca.logout(); refresh(); });
      refresh();
    });
  </script>
</body>
</html>
